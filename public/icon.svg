<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Corporate Navy -->
    <linearGradient id="pubTcBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F2746"/>
      <stop offset="100%" stop-color="#081524"/>
    </linearGradient>

    <!-- Signature Yellow Gold Gradient from TOP-COMPTA logo -->
    <linearGradient id="pubTcYellow" x1="0" y1="12" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Blue Gradient for Letter T -->
    <linearGradient id="pubTcBlue" x1="0" y1="20" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B1C30"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Gold Edge -->
  <rect width="64" height="64" rx="15" fill="url(#pubTcBg)" stroke="#E7B821" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Left: The Signature Yellow Box from Logo (like "TOP") -->
  <rect x="7" y="12" width="22" height="40" rx="5" fill="url(#pubTcYellow)"/>

  <!-- Inside Yellow Box: Bold Letter T (6px stroke, perfectly centered) -->
  <path d="M11 20H25V26H21V44H15V26H11V20Z" fill="url(#pubTcBlue)"/>

  <!-- Middle: Bold Hyphen connecting T and C -->
  <rect x="31" y="29.5" width="5.5" height="5" rx="1.5" fill="#E7B821"/>

  <!-- Right: Bold Letter C with 3D Gold Shadow matching COMPTA in Logo -->
  <!-- 3D Shadow -->
  <path d="M55.5 24C53.8 21.2 50.8 20 47 20C40.4 20 35 25.4 35 32C35 38.6 40.4 44 47 44C50.8 44 53.8 42.8 55.5 40L51.2 36.2C50.2 37.5 48.8 38 47 38C43.7 38 41 35.3 41 32C41 28.7 43.7 26 47 26C48.8 26 50.2 26.5 51.2 27.8L55.5 24Z" transform="translate(1.2, 1.2)" fill="#B45309" opacity="0.75"/>

  <!-- Main C Shape (Crisp White Face) -->
  <path d="M55.5 24C53.8 21.2 50.8 20 47 20C40.4 20 35 25.4 35 32C35 38.6 40.4 44 47 44C50.8 44 53.8 42.8 55.5 40L51.2 36.2C50.2 37.5 48.8 38 47 38C43.7 38 41 35.3 41 32C41 28.7 43.7 26 47 26C48.8 26 50.2 26.5 51.2 27.8L55.5 24Z" fill="#FFFFFF"/>
</svg>
