  <rect x="29.5" y="29.5" width="5" height="5" fill="url(#appleTcBlueFill)"/>

  <!-- Right: Letter C in Blue with Logo Gold 3D Accent (matching COMPTA in logo) -->
  <!-- 3D Gold Accent Edge -->
  <path d="M60 23.5C57.5 19.5 53 18 48 18C40 18 36 24 36 32C36 40 40 46 48 46C53 46 57.5 44.5 60 40.5L54.5 36.5C53.2 38.8 50.8 39.5 48 39.5C44.2 39.5 42.5 36.2 42.5 32C42.5 27.8 44.2 24.5 48 24.5C50.8 24.5 53.2 25.2 54.5 27.5L60 23.5Z" transform="translate(1.5, 1.5)" fill="#F59E0B"/>

  <!-- Main C in Blue -->
  <path d="M60 23.5C57.5 19.5 53 18 48 18C40 18 36 24 36 32C36 40 40 46 48 46C53 46 57.5 44.5 60 40.5L54.5 36.5C53.2 38.8 50.8 39.5 48 39.5C44.2 39.5 42.5 36.2 42.5 32C42.5 27.8 44.2 24.5 48 24.5C50.8 24.5 53.2 25.2 54.5 27.5L60 23.5Z" fill="url(#appleTcBlueFill)"/>
