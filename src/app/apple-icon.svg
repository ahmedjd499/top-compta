<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180" fill="none">
  <defs>
    <!-- Logo Yellow Gradient (sharp box) -->
    <linearGradient id="appleTcYellowBox" x1="0" y1="12" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Logo Corporate Blue -->
    <linearGradient id="appleTcBlueFill" x1="0" y1="18" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#254A8C"/>
      <stop offset="100%" stop-color="#1B3666"/>
    </linearGradient>
  </defs>

  <!-- Left: The Signature Yellow Box (SHARP CORNERS, NO ROUNDING) -->
  <rect x="2" y="12" width="26" height="40" fill="url(#appleTcYellowBox)"/>

  <!-- Letter T in Blue (inside yellow box, sharp geometric sans-serif) -->
  <path d="M6 18H24V25H18.5V46H11.5V25H6V18Z" fill="url(#appleTcBlueFill)"/>

  <!-- Middle: Hyphen '-' in Blue with Gold 3D Accent -->
